# Paths are relative to this file.
project_name: commons-io
release: rel/commons-io-2.22.0           # git tag you analyse (pin it!)
project_root: projects/commons-io
source_dirs: [src/main/java]
classes_dir: target/classes                # relative to project_root
package_prefix: org.apache.commons.io      # only packages under this prefix count

designite:                 # `designite` command: java -jar DesigniteJava.jar -i <input> -o <output_dir>
  tool: tools/DesigniteJava.jar
  input: projects/commons-io/src/main/java
  output_dir: data/designite/commons-io
designite_csv: data/designite/commons-io/ArchitectureSmells.csv
data_dir: data/commons-io

smells: [CyclicDependency, UnstableDependency, GodComponent, FeatureConcentration]

thresholds:                 # used only for the independent structural cross-check
  god_component_loc: 27000
  god_component_classes: 30
  unstable_ratio: 0.3       # share of a package's dependencies pointing to less stable packages

benchmark:
  clean_ratio: 1.0          # clean packages sampled per smelly package
  seed: 42

llm:
  model: claude-sonnet-5-5
  max_tokens: 4000
  temperature: 0            # set to null if a model rejects it
  repeats: 3

context:
  max_source_chars: 60000   # above this, a package is sent as a skeleton (signatures only)
  history_commits: 20
  rag_top_k: 5
  embedding_model: jinaai/jina-embeddings-v2-base-code   # "hash" = offline test embedder
