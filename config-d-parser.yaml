# D_Parser (C#). Paths are relative to this file.
project_name: D_Parser
language: csharp
release: 0cdef0ec17ddf955f348403a4c81c907e30e1052   # commit of the analysed code; C3/C4 need it in a git clone
project_root: projects/DParser2            # the DParser2 library (DParser2.sln + .csproj)
source_dirs: [.]                           # bin/, obj/ and .vs/ are skipped
classes_dir: bin                           # unused for C#
package_prefix: D_Parser                   # only namespaces under this prefix count

# Designite baseline, run on Windows with `python -m smells.cli --config config-d-parser.yaml designite`:
#   cd tools\DesigniteConsole;  dotnet DesigniteConsole.dll -i <abs input> -o <abs output_dir>
designite:
  tool: tools/DesigniteConsole/DesigniteConsole.dll
  input: projects/DParser2/DParser2.sln
  output_dir: data/designite/D_Parser-windows
designite_csv: data/designite/D_Parser-windows    # a folder is searched for the *ArchSmells*.csv
# Older 2019 result from the miningSmellData set (Results/aBothe_D_Parser):
# designite_csv: data/designite/D_Parser/Designite_DParser2_ArchSmells.csv
data_dir: data/D_Parser

smells: [CyclicDependency, UnstableDependency, GodComponent, FeatureConcentration]

thresholds:                 # used only for the independent structural cross-check
  god_component_loc: 27000
  god_component_classes: 30
  unstable_ratio: 0.3       # share of a package's dependencies pointing to less stable packages

benchmark:
  clean_ratio: 1.0          # clean packages sampled per smelly package
  seed: 42

llm:
  model: claude-sonnet-5-5
  max_tokens: 4000
  temperature: 0            # set to null if a model rejects it
  repeats: 3

context:
  max_source_chars: 60000   # above this, a package is sent as a skeleton (signatures only)
  history_commits: 20
  rag_top_k: 5
  embedding_model: jinaai/jina-embeddings-v2-base-code   # "hash" = offline test embedder
